<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Acme Support</h1>
      <nav>
        <ul>
          <li>Home</li>
          <li>Help</li>
          <li>Contact</li>
        </ul>
      </nav>
      <hr />
    </header>
    <main>
      <h2>Contact Us</h2>
      <p>Send us a message and we will get back to you.</p>
      <form action="/action-page.html" method="post">
        <label for="fname">Full name:</label><br />
        <input type="text" id="fname" name="fname" required /><br />
        <label for="email">Email:</label><br />
        <input type="text" id="email" name="email" required /><br />

        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="topic1">Choose a topic</option>
          <option value="topic2">Or choose this topic</option>
          <option value="topic3">Maybe even this topic</option></select
        ><br />
        <label for="message">Message</label>
        <textarea id="message" name="message" required minlength="8"></textarea
        ><br />
        <fieldset>
          <legend>How did you hear about us?</legend>
          <input type="radio" id="search" name="search" value="search" />
          <label for="search">Search</label><br />
          <input type="radio" id="friend" name="friend" value="friend" />
          <label for="friend">Friend</label><br />
          <input type="radio" id="social" name="social" value="social" />
          <label for="social">Social Media</label><br />
        </fieldset>
        <br />
        <input type="checkbox" id="updates" name="updates" value="updates" />
        <label for="updates">Send me product updates</label><br />
        <br />
        <button type="submit" value="Submit">Submit</button>
      </form>
      <hr />
      <p>© Acme Support</p>
    </main>
  </body>
</html>
