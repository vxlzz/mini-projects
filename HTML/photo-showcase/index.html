<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Showcase</title>
  </head>
  <body>
    <header>
      <h1>Photo Showcase</h1>
      <nav>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Contact</li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <img
          src="./assets/img1.jpg"
          alt="A rolling hillside with evergreen trees"
          width="200"
          height="300"
        />
        <img
          src="./assets/img2.jpg"
          alt="Vibrant green countryside with a mountain in the distance"
          width="200"
          height="300"
        />
        <img src="./assets/img3.jpg" alt="" width="200" height="300" />
      </section>
      <section>
        <figure>
          <figcaption>A Collection of Images</figcaption>
          <img
            src="./assets/img4.jpg"
            alt="Rolling grass hills with a path upon the crests"
            width="200"
            height="300"
          />
          <img
            src="./assets/img5.jpg"
            alt="A countryside overview with thistles in the near vicinity"
            width="200"
            height="300"
          />
          <img
            src="./assets/img6.jpg"
            alt="A view of hills from a backgarden, the hills are topped in cloud"
            width="200"
            height="300"
          />
        </figure>
      </section>
      <section>
        <video width="320" height="240" controls poster="./assets/thumb.png">
          <source src="./assets/video.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </section>
    </main>
  </body>
</html>
